name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Installs the pnpm version named in package.json ("packageManager")
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 is the current long-term-support version (Node 20 stopped getting fixes in April 2026)
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir frontend build
      - name: Unit test frontend (Vitest)
        run: pnpm --dir frontend test:unit --run
      - name: Test backend
        run: pnpm --dir backend test

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A throwaway database and test-only key, so this job needs no secrets
      MONGO_URI: mongodb://localhost:27017
      JWT_SECRET: e2e-test-only-not-a-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run E2E tests (Playwright)
        run: pnpm test:e2e
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
